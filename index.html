<head>

    <title>Rpg com objetos</title>
</head>
<body>
   <h1>RPG COM OBJETOS</h1>
   <p>Selecione um personagem para começar a jogar!</p>

        <h2>Guerreiro</h2>
        <strong>Thorin</strong>

        <p>Ataque: <span id="ataque-guerreiro"></span></p>
        <button id="guerreiro-atacar">Atacar</button>
   
    </div>

    <div>
        <h2>Mago</h2>
        <strong>Gandalfe</strong>

        <p>Ataque: <span id="ataque-mago"></span></p>
        <button id="mago-atacar">Atacar</button>
   
    </div>
   
    <script src="app.js"></script>
</body>
</html>
